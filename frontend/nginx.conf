server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that isn't a real static file falls back to
    # index.html so React Router can handle client-side routes like
    # /stocks/TCS on a direct load or page refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable caching for hashed static assets Vite produces.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
